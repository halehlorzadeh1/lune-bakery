name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  check:
    name: Install, lint & verify startup
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install linting tools
        run: pip install ruff

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Verify app imports & starts
        # Starts the server, waits for it to be ready, then shuts it down.
        # Catches import errors, missing env vars with no default, syntax issues.
        run: |
          uvicorn app:app --port 8000 &
          SERVER_PID=$!
          sleep 4
          curl --fail --retry 3 --retry-delay 1 http://localhost:8000/api/health
          kill $SERVER_PID
        env:
          # Provide placeholder values so optional env vars don't block startup
          SMTP_HOST: ""
          SMTP_USER: ""
          SMTP_PASS: ""
          SENDGRID_API_KEY: ""
